name: Apply dark pipe outlines

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply-outline:
    if: github.event.pull_request.head.ref == 'agent/outline-near-black-pipes' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/outline-near-black-pipes

      - name: Patch both canvas renderers
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          helper = '''    const DARK_PIPE_OUTLINE_LUMINANCE = 48;

              function pipe_color_needs_light_outline(color) {
                  const match = /^#([0-9a-f]{6})$/i.exec(String(color || ""));

                  if (!match) {
                      return false;
                  }

                  const value = Number.parseInt(match[1], 16);
                  const red = (value >>> 16) & 255;
                  const green = (value >>> 8) & 255;
                  const blue = value & 255;
                  const luminance =
                      red * 0.2126 + green * 0.7152 + blue * 0.0722;

                  return luminance <= DARK_PIPE_OUTLINE_LUMINANCE;
              }

          '''

          color_block = '''            const palette = this.level.palette || Choobs.PIPE_COLORS;
                      const pipe_color = palette[pipe.color_index % palette.length];
                      const intro_alpha = this.get_intro_alpha(
          '''
          color_replacement = '''            const palette = this.level.palette || Choobs.PIPE_COLORS;
                      const pipe_color = palette[pipe.color_index % palette.length];
                      const needs_light_outline =
                          !blocked && pipe_color_needs_light_outline(pipe_color);
                      const intro_alpha = this.get_intro_alpha(
          '''

          stroke_block = '''            this.stroke_polyline(
                          context,
                          points,
                          "#080a0e",
                          outer_width
                      );
                      this.stroke_polyline(
                          context,
                          points,
                          blocked ? "#ff7d8f" : pipe_color,
                          inner_width
                      );
          '''
          stroke_replacement = '''            this.stroke_polyline(
                          context,
                          points,
                          "#080a0e",
                          outer_width
                      );

                      if (needs_light_outline) {
                          const light_outline_width = Math.min(
                              outer_width,
                              inner_width + Math.max(1, cell_size * 0.055)
                          );
                          this.stroke_polyline(
                              context,
                              points,
                              "#ffffff",
                              light_outline_width
                          );
                      }

                      this.stroke_polyline(
                          context,
                          points,
                          blocked ? "#ff7d8f" : pipe_color,
                          inner_width
                      );
          '''

          arrow_line = '                outer: "#080a0e",'
          arrow_replacement = '''                outer: needs_light_outline && !hinted ?
                              "#ffffff" :
                              "#080a0e",'''

          for path_string in [
              "js/canvas_renderer.js",
              "creator/js/canvas_renderer.js"
          ]:
              path = Path(path_string)
              text = path.read_text()
              text = replace_once(
                  text,
                  "    class CanvasRenderer {",
                  helper + "    class CanvasRenderer {",
                  f"{path_string} helper"
              )
              text = replace_once(
                  text,
                  color_block,
                  color_replacement,
                  f"{path_string} colour check"
              )
              text = replace_once(
                  text,
                  stroke_block,
                  stroke_replacement,
                  f"{path_string} body outline"
              )
              text = replace_once(
                  text,
                  arrow_line,
                  arrow_replacement,
                  f"{path_string} arrow outline"
              )
              path.write_text(text)
          PY

      - name: Validate renderer behavior
        shell: bash
        run: |
          node --check js/canvas_renderer.js
          node --check creator/js/canvas_renderer.js

          node <<'JS'
          const assert = require('assert');
          const fs = require('fs');
          const vm = require('vm');

          function renderStrokes(path, color, visualState = {}) {
              const strokes = [];
              const drawingContext = {
                  save() {},
                  restore() {},
                  translate() {},
                  beginPath() {},
                  moveTo() {},
                  lineTo() {},
                  stroke() {
                      strokes.push({
                          color: this.strokeStyle,
                          width: this.lineWidth
                      });
                  },
                  arc() {},
                  fill() {},
                  setLineDash() {},
                  strokeStyle: '',
                  lineWidth: 0,
                  globalAlpha: 1,
                  shadowColor: '',
                  shadowBlur: 0,
                  lineCap: '',
                  lineJoin: '',
                  fillStyle: ''
              };
              const backgroundContext = { ...drawingContext };
              const canvas = {
                  style: {},
                  parentElement: null,
                  getBoundingClientRect: () => ({ width: 100, height: 100 }),
                  getContext: () => drawingContext
              };
              const context = {
                  console,
                  performance: { now: () => 0 },
                  window: { devicePixelRatio: 1 },
                  document: {
                      createElement: () => ({
                          width: 1,
                          height: 1,
                          getContext: () => backgroundContext
                      })
                  },
                  Choobs: {
                      PIPE_COLORS: ['#ff5c7a'],
                      normalize_level: (level) => level
                  }
              };
              context.globalThis = context;
              vm.createContext(context);
              vm.runInContext(fs.readFileSync(path, 'utf8'), context);

              const renderer = new context.ChoobsCanvasRenderer(canvas);
              renderer.level = {
                  palette: [color],
                  columns: 4,
                  rows: 4
              };
              renderer.board_bounds = { x: 0, y: 0, size: 48, cell_size: 12 };
              renderer.cell_center = (x, y) => ({ x, y });
              renderer.get_intro_alpha = () => 1;
              renderer.draw_speed_streaks = () => {};
              renderer.draw_motion_tip = () => {};

              const pipe = {
                  id: 7,
                  color_index: 0,
                  cells: [{ x: 0, y: 0 }, { x: 1, y: 0 }],
                  direction: { x: 1, y: 0 },
                  active: true
              };
              const session = {
                  moving_pipes: new Set(),
                  get_render_cells: () => pipe.cells
              };

              renderer.draw_pipe(
                  drawingContext,
                  session,
                  pipe,
                  visualState,
                  0
              );
              return strokes;
          }

          for (const path of [
              'js/canvas_renderer.js',
              'creator/js/canvas_renderer.js'
          ]) {
              const black = renderStrokes(path, '#000000');
              assert.strictEqual(
                  black.filter((stroke) => stroke.color === '#ffffff').length,
                  2,
                  `${path} should outline the body and arrow for black pipes`
              );
              const threshold = renderStrokes(path, '#303030');
              assert.strictEqual(
                  threshold.filter((stroke) => stroke.color === '#ffffff').length,
                  2,
                  `${path} should include the threshold colour`
              );
              const aboveThreshold = renderStrokes(path, '#313131');
              assert.strictEqual(
                  aboveThreshold.filter((stroke) => stroke.color === '#ffffff').length,
                  0,
                  `${path} should not outline colours above the threshold`
              );
              const bright = renderStrokes(path, '#ff5c7a');
              assert.strictEqual(
                  bright.filter((stroke) => stroke.color === '#ffffff').length,
                  0,
                  `${path} should leave normal bright pipes unchanged`
              );
              const blocked = renderStrokes(path, '#000000', {
                  blocked_pipe_id: 7
              });
              assert.strictEqual(
                  blocked.filter((stroke) => stroke.color === '#ffffff').length,
                  0,
                  `${path} should keep the red blocked-state treatment`
              );
          }
          JS

      - name: Commit completed change
        shell: bash
        run: |
          rm -f .github/workflows/apply-dark-pipe-outline.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Outline near-black pipes in white'
          git push origin HEAD:agent/outline-near-black-pipes
