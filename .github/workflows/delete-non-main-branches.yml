name: Delete non-main branches

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'agent/delete-all-non-main-branches'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Delete every branch except main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          while IFS= read -r ref; do
            branch="${ref#refs/remotes/origin/}"
            if [[ "$branch" == "HEAD" || "$branch" == "main" ]]; then
              continue
            fi
            echo "Deleting $branch"
            git push origin --delete "$branch"
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin)

      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/delete-non-main-branches.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary branch cleanup workflow'
          git push origin HEAD:main
