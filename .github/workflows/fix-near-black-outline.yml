name: Fix near-black outline visibility

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.pull_request.head.ref == 'agent/fix-near-black-outline-visibility' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-near-black-outline-visibility

      - name: Strengthen near-black outlines
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          paths = [
              Path('js/canvas_renderer.js'),
              Path('creator/js/canvas_renderer.js'),
          ]

          old_threshold = 'const DARK_PIPE_OUTLINE_LUMINANCE = 48;'
          new_threshold = 'const DARK_PIPE_OUTLINE_LUMINANCE = 72;'
          old_width = '''                const light_outline_width = Math.min(
                    outer_width,
                    inner_width + Math.max(1, cell_size * 0.055)
                );'''
          new_width = '''                const light_outline_width = Math.min(
                    outer_width - Math.max(1, cell_size * 0.04),
                    inner_width + Math.max(1.5, cell_size * 0.1)
                );'''

          for path in paths:
              text = path.read_text()
              if text.count(old_threshold) != 1:
                  raise RuntimeError(f'{path}: expected one luminance threshold')
              if text.count(old_width) != 1:
                  raise RuntimeError(f'{path}: expected one outline-width block')
              text = text.replace(old_threshold, new_threshold)
              text = text.replace(old_width, new_width)
              path.write_text(text)
          PY

      - name: Validate outline behavior
        shell: bash
        run: |
          node --check js/canvas_renderer.js
          node --check creator/js/canvas_renderer.js

          node <<'JS'
          const fs = require('fs');
          const assert = require('assert');

          for (const path of ['js/canvas_renderer.js', 'creator/js/canvas_renderer.js']) {
            const source = fs.readFileSync(path, 'utf8');
            assert(source.includes('const DARK_PIPE_OUTLINE_LUMINANCE = 72;'));
            assert(source.includes('outer_width - Math.max(1, cell_size * 0.04)'));
            assert(source.includes('inner_width + Math.max(1.5, cell_size * 0.1)'));

            const threshold = 72;
            const luminance = hex => {
              const value = parseInt(hex.slice(1), 16);
              const red = (value >>> 16) & 255;
              const green = (value >>> 8) & 255;
              const blue = value & 255;
              return red * 0.2126 + green * 0.7152 + blue * 0.0722;
            };
            assert(luminance('#000000') <= threshold);
            assert(luminance('#303030') <= threshold);
            assert(luminance('#484848') <= threshold);
            assert(luminance('#494949') > threshold);

            const cellSize = 12;
            const outerWidth = cellSize * 0.5;
            const innerWidth = cellSize * 0.3;
            const outlineWidth = Math.min(
              outerWidth - Math.max(1, cellSize * 0.04),
              innerWidth + Math.max(1.5, cellSize * 0.1)
            );
            assert((outlineWidth - innerWidth) / 2 >= 0.69);
            assert((outerWidth - outlineWidth) / 2 >= 0.49);
          }
          JS

      - name: Commit completed fix
        shell: bash
        run: |
          rm -f .github/workflows/fix-near-black-outline.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make near-black pipe outlines visible'
          git push origin HEAD:agent/fix-near-black-outline-visibility
