name: Fix startup pipe breath

on:
  push:
    branches:
      - agent/fix-startup-pipe-breath

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-startup-pipe-breath

      - name: Anchor and complete pipe breaths
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          renderer_paths = [
              Path('js/canvas_renderer.js'),
              Path('creator/js/canvas_renderer.js'),
          ]

          for path in renderer_paths:
              text = path.read_text()

              constants = '''    const PIPE_BREATH_BEZIER = [0.42, 0, 0.58, 1];

    function cubic_bezier_axis(time, control_1, control_2) {'''
              constants_replacement = '''    const PIPE_BREATH_BEZIER = [0.42, 0, 0.58, 1];

    function get_current_time() {
        return global_scope.performance &&
            typeof global_scope.performance.now === "function" ?
                global_scope.performance.now() :
                0;
    }

    function cubic_bezier_axis(time, control_1, control_2) {'''
              if constants not in text:
                  raise RuntimeError(f'{path}: breath constants insertion point not found')
              text = text.replace(constants, constants_replacement, 1)

              constructor = '''            this.background_dirty = true;
        }

        get show_mask() {'''
              constructor_replacement = '''            this.background_dirty = true;
            this.pipe_breath_started_at = get_current_time();
            this.pipe_breath_was_active = false;
        }

        reset_pipe_breath(time = get_current_time()) {
            const numeric_time = Number(time);
            this.pipe_breath_started_at = Number.isFinite(numeric_time) ?
                numeric_time :
                0;
            this.pipe_breath_was_active = false;
        }

        get_pipe_breath_amount(time) {
            const numeric_time = Number(time);
            const current_time = Number.isFinite(numeric_time) ?
                numeric_time :
                0;
            const elapsed = Math.max(
                0,
                current_time - this.pipe_breath_started_at
            );
            return get_pipe_breath_amount(elapsed);
        }

        should_render_pipe_breath(time) {
            const active = this.get_pipe_breath_amount(time) > 0;
            const should_render = active || this.pipe_breath_was_active;
            this.pipe_breath_was_active = active;
            return should_render;
        }

        get show_mask() {'''
              if constructor not in text:
                  raise RuntimeError(f'{path}: renderer constructor insertion point not found')
              text = text.replace(constructor, constructor_replacement, 1)

              set_level = '''        set_level(level) {
            this.level = Choobs.normalize_level(level);
            this.background_dirty = true;
            this.resize();
        }'''
              set_level_replacement = '''        set_level(level) {
            this.level = Choobs.normalize_level(level);
            this.reset_pipe_breath();
            this.background_dirty = true;
            this.resize();
        }'''
              if set_level not in text:
                  raise RuntimeError(f'{path}: set_level block not found')
              text = text.replace(set_level, set_level_replacement, 1)

              breath_use = '            const breath_amount = get_pipe_breath_amount(time);'
              breath_use_replacement = (
                  '            const breath_amount = '
                  'this.get_pipe_breath_amount(time);'
              )
              if breath_use not in text:
                  raise RuntimeError(f'{path}: pipe breath draw call not found')
              text = text.replace(breath_use, breath_use_replacement, 1)

              path.write_text(text)

          loop_paths = [
              Path('js/game.js'),
              Path('creator/js/creator.js'),
          ]

          for path in loop_paths:
              text = path.read_text()
              marker = '''                const should_render =
                    this.needs_render ||'''
              replacement = '''                const pipe_breath_active =
                    this.renderer.should_render_pipe_breath(time);
                const should_render =
                    this.needs_render ||
                    pipe_breath_active ||'''
              if marker not in text:
                  raise RuntimeError(f'{path}: render condition insertion point not found')
              text = text.replace(marker, replacement, 1)
              path.write_text(text)
          PY

      - name: Validate startup pulse behavior
        shell: bash
        run: |
          node --check js/canvas_renderer.js
          node --check creator/js/canvas_renderer.js
          node --check js/game.js
          node --check creator/js/creator.js

          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');

          function loadRenderer(path) {
              const context2d = {};
              const makeCanvas = () => ({
                  getContext: () => context2d,
                  style: {},
                  width: 1,
                  height: 1,
              });
              const scope = {
                  console,
                  Math,
                  Number,
                  String,
                  Object,
                  Array,
                  Map,
                  Set,
                  Uint8Array,
                  performance: { now: () => 1234 },
                  devicePixelRatio: 1,
                  document: { createElement: makeCanvas },
                  Choobs: { normalize_level: (level) => level },
              };
              scope.window = scope;
              scope.globalThis = scope;
              vm.createContext(scope);
              vm.runInContext(fs.readFileSync(path, 'utf8'), scope, { filename: path });
              return new scope.ChoobsCanvasRenderer(makeCanvas());
          }

          for (const path of ['js/canvas_renderer.js', 'creator/js/canvas_renderer.js']) {
              const renderer = loadRenderer(path);
              renderer.reset_pipe_breath(1000);

              if (renderer.get_pipe_breath_amount(5999) !== 0) {
                  throw new Error(`${path}: breath began before five idle seconds`);
              }
              if (renderer.should_render_pipe_breath(6000)) {
                  throw new Error(`${path}: zero-width pulse boundary requested a frame`);
              }

              const rising = renderer.get_pipe_breath_amount(6250);
              if (!(rising > 0 && rising < 1)) {
                  throw new Error(`${path}: quarter-pulse amount is invalid`);
              }
              if (!renderer.should_render_pipe_breath(6250)) {
                  throw new Error(`${path}: active pulse did not request rendering`);
              }

              const peak = renderer.get_pipe_breath_amount(6500);
              if (Math.abs(peak - 1) > 0.00001) {
                  throw new Error(`${path}: midpoint did not reach full white`);
              }
              if (!renderer.should_render_pipe_breath(6999)) {
                  throw new Error(`${path}: falling pulse did not request rendering`);
              }
              if (!renderer.should_render_pipe_breath(7000)) {
                  throw new Error(`${path}: final cleanup frame was not requested`);
              }
              if (renderer.should_render_pipe_breath(7016)) {
                  throw new Error(`${path}: cleanup frame remained active`);
              }

              renderer.reset_pipe_breath(9000);
              if (renderer.get_pipe_breath_amount(9000) !== 0 ||
                  renderer.get_pipe_breath_amount(13999) !== 0) {
                  throw new Error(`${path}: resetting did not restore a full idle period`);
              }
          }
          NODE

          python <<'PY'
          from pathlib import Path

          for path in [Path('js/game.js'), Path('creator/js/creator.js')]:
              text = path.read_text()
              required = [
                  'const pipe_breath_active =',
                  'this.renderer.should_render_pipe_breath(time);',
                  'pipe_breath_active ||',
              ]
              for snippet in required:
                  if snippet not in text:
                      raise RuntimeError(f'{path}: missing render-loop integration: {snippet}')

          main = Path('js/canvas_renderer.js').read_text()
          creator = Path('creator/js/canvas_renderer.js').read_text()
          required_renderer = [
              'this.pipe_breath_started_at = get_current_time();',
              'reset_pipe_breath(time = get_current_time())',
              'should_render_pipe_breath(time)',
              'this.reset_pipe_breath();',
              'this.get_pipe_breath_amount(time);',
          ]
          for snippet in required_renderer:
              if snippet not in main or snippet not in creator:
                  raise RuntimeError(f'renderer integration missing: {snippet}')
          PY

      - name: Commit completed fix
        shell: bash
        run: |
          rm -f .github/workflows/fix-startup-pipe-breath.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix startup pipe breath animation'
          git push origin HEAD:agent/fix-startup-pipe-breath
