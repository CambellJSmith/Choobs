name: Apply level select name cache

on:
  push:
    branches:
      - agent/cache-level-select-names

permissions:
  contents: write

jobs:
  apply-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cache-level-select-names

      - name: Apply level-name cache update
        run: python .github/apply-level-select-names.py

      - name: Validate level-name behavior
        shell: bash
        run: |
          node --check js/game.js
          python <<'PY'
          from pathlib import Path

          text = Path('js/game.js').read_text()
          required = [
              'this.level_name_cache = this.load_level_name_cache();',
              'const name_prefetch = this.preload_level_names(target_number);',
              'async preload_level_names(preferred_number = null)',
              'worker_count = Math.min(4, candidates.length)',
              'localStorage.getItem("choobs_level_name_cache_v1")',
              'localStorage.setItem(',
              'this.remember_level_name(level);',
              'const cached_name = this.level_name_cache.get(level.number);',
          ]

          for snippet in required:
              if snippet not in text:
                  raise RuntimeError(f'missing expected implementation: {snippet}')
          PY

      - name: Commit completed update
        shell: bash
        run: |
          rm -f .github/apply-level-select-names.py
          rm -f .github/workflows/apply-level-select-names.yml
          rm -f .github/workflows/cache-level-select-names.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Cache level names for the level selector'
          git push origin HEAD:agent/cache-level-select-names
