name: Remove outlines and add pipe breathing

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply-update:
    if: github.event.pull_request.head.ref == 'agent/remove-outline-add-pipe-breath' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-outline-add-pipe-breath

      - name: Replace dark outlines with synchronized breathing
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          paths = [
              Path('js/canvas_renderer.js'),
              Path('creator/js/canvas_renderer.js'),
          ]

          helper_pattern = re.compile(
              r'\n    const DARK_PIPE_OUTLINE_LUMINANCE = 73\.5;\n\n'
              r'    function pipe_color_needs_light_outline\(color\) \{.*?\n'
              r'    \}\n',
              re.S,
          )

          breathing_helpers = '''
              const PIPE_BREATH_PERIOD_MS = 4200;
              const PIPE_BREATH_DURATION_MS = 850;

              function get_pipe_breath_amount(time) {
                  const numeric_time = Number(time) || 0;
                  const phase = (
                      (numeric_time % PIPE_BREATH_PERIOD_MS) +
                      PIPE_BREATH_PERIOD_MS
                  ) % PIPE_BREATH_PERIOD_MS;

                  if (phase >= PIPE_BREATH_DURATION_MS) {
                      return 0;
                  }

                  const progress = phase / PIPE_BREATH_DURATION_MS;
                  const wave = Math.sin(progress * Math.PI);
                  return wave * wave;
              }

              function breathe_pipe_color(color, amount) {
                  const match = /^#([0-9a-f]{6})$/i.exec(String(color || ""));

                  if (!match || amount <= 0) {
                      return color;
                  }

                  const value = Number.parseInt(match[1], 16);
                  const mix = Math.max(0, Math.min(1, amount));
                  const red = (value >>> 16) & 255;
                  const green = (value >>> 8) & 255;
                  const blue = value & 255;
                  const breathed_red = Math.round(red + (255 - red) * mix);
                  const breathed_green = Math.round(green + (255 - green) * mix);
                  const breathed_blue = Math.round(blue + (255 - blue) * mix);

                  return `rgb(${breathed_red}, ${breathed_green}, ${breathed_blue})`;
              }
          '''
          breathing_helpers = '\n'.join(
              line[4:] if line.startswith('    ') else line
              for line in breathing_helpers.splitlines()
          )

          color_pattern = re.compile(
              r'(?P<indent>\s*)const rendered_pipe_color = blocked \?\s*'
              r'"#ff7d8f" :\s*'
              r'hinted \?\s*'
              r'"#7ee3c5" :\s*'
              r'pipe_color;\s*'
              r'const needs_light_outline =\s*'
              r'!blocked && !hinted &&\s*'
              r'pipe_color_needs_light_outline\(pipe_color\);'
          )

          outline_pattern = re.compile(
              r'\n\s*if \(needs_light_outline\) \{\s*'
              r'const light_outline_width = Math\.min\(\s*'
              r'outer_width - Math\.max\(1, cell_size \* 0\.04\),\s*'
              r'inner_width \+ Math\.max\(1\.5, cell_size \* 0\.1\)\s*'
              r'\);\s*'
              r'this\.stroke_pipe_shape\(\s*'
              r'context,\s*points,\s*pipe\.direction,\s*cell_size,\s*'
              r'"#ffffff",\s*light_outline_width\s*'
              r'\);\s*'
              r'\}\n',
              re.S,
          )

          for path in paths:
              text = path.read_text()

              text, helper_count = helper_pattern.subn(
                  '\n' + breathing_helpers + '\n',
                  text,
              )
              if helper_count != 1:
                  raise RuntimeError(
                      f'{path}: expected one dark-outline helper block, found {helper_count}'
                  )

              def replace_color(match):
                  indent = match.group('indent')
                  return (
                      f'{indent}const base_pipe_color = blocked ?\n'
                      f'{indent}    "#ff7d8f" :\n'
                      f'{indent}    hinted ?\n'
                      f'{indent}        "#7ee3c5" :\n'
                      f'{indent}        pipe_color;\n'
                      f'{indent}const breath_amount = get_pipe_breath_amount(time);\n'
                      f'{indent}const rendered_pipe_color = breathe_pipe_color(\n'
                      f'{indent}    base_pipe_color,\n'
                      f'{indent}    breath_amount\n'
                      f'{indent});'
                  )

              text, color_count = color_pattern.subn(replace_color, text)
              if color_count != 1:
                  raise RuntimeError(
                      f'{path}: expected one rendered-pipe color block, found {color_count}'
                  )

              text, outline_count = outline_pattern.subn('\n', text)
              if outline_count != 1:
                  raise RuntimeError(
                      f'{path}: expected one light-outline stroke block, found {outline_count}'
                  )

              if text.count('context.shadowColor = pipe_color;') != 1:
                  raise RuntimeError(f'{path}: expected one moving shadow color')
              text = text.replace(
                  'context.shadowColor = pipe_color;',
                  'context.shadowColor = rendered_pipe_color;',
              )

              motion_tip_pattern = re.compile(
                  r'(this\.draw_motion_tip\(\s*context,\s*arrow_tip,\s*)'
                  r'pipe_color(,\s*cell_size,\s*time,\s*pipe\.id\s*\);)',
                  re.S,
              )
              text, motion_tip_count = motion_tip_pattern.subn(
                  r'\1rendered_pipe_color\2',
                  text,
              )
              if motion_tip_count != 1:
                  raise RuntimeError(
                      f'{path}: expected one motion-tip color usage, found {motion_tip_count}'
                  )

              path.write_text(text)
          PY

      - name: Validate breathing behavior
        shell: bash
        run: |
          node --check js/canvas_renderer.js
          node --check creator/js/canvas_renderer.js

          node <<'JS'
          const fs = require('fs');
          const vm = require('vm');
          const assert = require('assert');

          for (const path of ['js/canvas_renderer.js', 'creator/js/canvas_renderer.js']) {
            const source = fs.readFileSync(path, 'utf8');
            assert(!source.includes('DARK_PIPE_OUTLINE_LUMINANCE'));
            assert(!source.includes('pipe_color_needs_light_outline'));
            assert(!source.includes('needs_light_outline'));
            assert(!source.includes('light_outline_width'));
            assert(source.includes('const PIPE_BREATH_PERIOD_MS = 4200;'));
            assert(source.includes('const PIPE_BREATH_DURATION_MS = 850;'));
            assert(source.includes('get_pipe_breath_amount(time)'));
            assert(source.includes('breathe_pipe_color('));

            const context = {
              save() {}, restore() {}, translate() {}, beginPath() {},
              moveTo() {}, lineTo() {}, stroke() {}, arc() {}, fill() {},
              set lineCap(value) {}, set lineJoin(value) {},
              set globalAlpha(value) {}, set shadowColor(value) {},
              set shadowBlur(value) {}, set strokeStyle(value) {},
              set lineWidth(value) {}, set fillStyle(value) {},
            };
            const canvas = { getContext: () => context };
            const sandbox = {
              console,
              Math,
              Number,
              String,
              Set,
              globalThis: null,
              document: { createElement: () => canvas },
              Choobs: { PIPE_COLORS: ['#123456'], normalize_level: value => value },
            };
            sandbox.globalThis = sandbox;
            vm.runInNewContext(source, sandbox, { filename: path });

            const Renderer = sandbox.ChoobsCanvasRenderer;
            const renderer = new Renderer(canvas);
            renderer.level = { palette: ['#123456'] };
            renderer.board_bounds = { x: 0, y: 0, size: 24, cell_size: 12 };
            renderer.cell_center = (x, y) => ({ x: x * 12, y: y * 12 });
            const colors = [];
            renderer.stroke_pipe_shape = (...args) => {
              colors.push(args[4]);
              return { x: 0, y: 0 };
            };

            const pipe = { id: 1, color_index: 0, direction: { x: 1, y: 0 } };
            const session = {
              moving_pipes: new Set(),
              get_render_cells: () => [{ x: 0, y: 0 }, { x: 1, y: 0 }],
            };

            renderer.draw_pipe(context, session, pipe, {}, 1000);
            assert.deepStrictEqual(colors, ['#080a0e', '#123456']);

            colors.length = 0;
            renderer.draw_pipe(context, session, pipe, {}, 425);
            assert.deepStrictEqual(colors, ['#080a0e', 'rgb(255, 255, 255)']);

            colors.length = 0;
            renderer.draw_pipe(context, session, pipe, { blocked_pipe_id: 1 }, 425);
            assert.deepStrictEqual(colors, ['#080a0e', 'rgb(255, 255, 255)']);

            colors.length = 0;
            renderer.draw_pipe(context, session, pipe, { hint_pipe_id: 1 }, 425);
            assert.deepStrictEqual(colors, ['#080a0e', 'rgb(255, 255, 255)']);

            colors.length = 0;
            renderer.draw_pipe(context, session, pipe, {}, 4625);
            assert.deepStrictEqual(colors, ['#080a0e', 'rgb(255, 255, 255)']);
          }
          JS

      - name: Commit completed update
        shell: bash
        run: |
          rm -f .github/workflows/remove-outline-add-pipe-breath.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace pipe outlines with white breathing'
          git push origin HEAD:agent/remove-outline-add-pipe-breath
