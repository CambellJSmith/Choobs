name: Finalize pipe breathing formatting

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  finalize-format:
    if: github.event.pull_request.head.ref == 'agent/remove-outline-add-pipe-breath' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-outline-add-pipe-breath

      - name: Apply exact renderer indentation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          paths = [
              Path('js/canvas_renderer.js'),
              Path('creator/js/canvas_renderer.js'),
          ]

          helpers = '\n'.join([
              '    const PIPE_BREATH_PERIOD_MS = 4200;',
              '    const PIPE_BREATH_DURATION_MS = 850;',
              '',
              '    function get_pipe_breath_amount(time) {',
              '        const numeric_time = Number(time) || 0;',
              '        const phase = (',
              '            (numeric_time % PIPE_BREATH_PERIOD_MS) +',
              '            PIPE_BREATH_PERIOD_MS',
              '        ) % PIPE_BREATH_PERIOD_MS;',
              '',
              '        if (phase >= PIPE_BREATH_DURATION_MS) {',
              '            return 0;',
              '        }',
              '',
              '        const progress = phase / PIPE_BREATH_DURATION_MS;',
              '        const wave = Math.sin(progress * Math.PI);',
              '        return wave * wave;',
              '    }',
              '',
              '    function breathe_pipe_color(color, amount) {',
              '        const match = /^#([0-9a-f]{6})$/i.exec(String(color || ""));',
              '',
              '        if (!match || amount <= 0) {',
              '            return color;',
              '        }',
              '',
              '        const value = Number.parseInt(match[1], 16);',
              '        const mix = Math.max(0, Math.min(1, amount));',
              '        const red = (value >>> 16) & 255;',
              '        const green = (value >>> 8) & 255;',
              '        const blue = value & 255;',
              '        const breathed_red = Math.round(red + (255 - red) * mix);',
              '        const breathed_green = Math.round(green + (255 - green) * mix);',
              '        const breathed_blue = Math.round(blue + (255 - blue) * mix);',
              '',
              '        return `rgb(${breathed_red}, ${breathed_green}, ${breathed_blue})`;',
              '    }',
              '',
              '',
          ])

          color_block = '\n'.join([
              '            const base_pipe_color = blocked ?',
              '                "#ff7d8f" :',
              '                hinted ?',
              '                    "#7ee3c5" :',
              '                    pipe_color;',
              '            const breath_amount = get_pipe_breath_amount(time);',
              '            const rendered_pipe_color = breathe_pipe_color(',
              '                base_pipe_color,',
              '                breath_amount',
              '            );',
          ]) + '\n'

          for path in paths:
              text = path.read_text()

              helper_start = text.find('const PIPE_BREATH_PERIOD_MS = 4200;')
              helper_end = text.find('    class CanvasRenderer', helper_start)
              if helper_start < 0 or helper_end < 0:
                  raise RuntimeError(f'{path}: breathing helper boundaries not found')
              text = text[:helper_start] + helpers + text[helper_end:]

              color_start = text.find('            const base_pipe_color = blocked ?')
              color_end = text.find('            const intro_alpha =', color_start)
              if color_start < 0 or color_end < 0:
                  raise RuntimeError(f'{path}: rendered color boundaries not found')
              text = text[:color_start] + color_block + text[color_end:]

              path.write_text(text)
          PY

      - name: Validate final formatting and syntax
        shell: bash
        run: |
          node --check js/canvas_renderer.js
          node --check creator/js/canvas_renderer.js
          grep -q '^    const PIPE_BREATH_PERIOD_MS = 4200;$' js/canvas_renderer.js
          grep -q '^    const PIPE_BREATH_PERIOD_MS = 4200;$' creator/js/canvas_renderer.js
          grep -q '^            const base_pipe_color = blocked ?$' js/canvas_renderer.js
          grep -q '^                "#ff7d8f" :$' js/canvas_renderer.js
          grep -q '^            const breath_amount = get_pipe_breath_amount(time);$' js/canvas_renderer.js
          grep -q '^            const rendered_pipe_color = breathe_pipe_color($' js/canvas_renderer.js
          grep -q '^            const base_pipe_color = blocked ?$' creator/js/canvas_renderer.js
          grep -q '^                "#ff7d8f" :$' creator/js/canvas_renderer.js
          ! grep -q 'DARK_PIPE_OUTLINE_LUMINANCE' js/canvas_renderer.js
          ! grep -q 'DARK_PIPE_OUTLINE_LUMINANCE' creator/js/canvas_renderer.js

      - name: Commit final formatting
        shell: bash
        run: |
          rm -f .github/workflows/finalize-pipe-breath-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize pipe breathing renderer formatting'
          git push origin HEAD:agent/remove-outline-add-pipe-breath
