name: Integrate arrow into pipe shape

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  integrate-shape:
    if: github.event.pull_request.head.ref == 'agent/integrate-arrow-into-pipe-shape' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/integrate-arrow-into-pipe-shape

      - name: Integrate arrow geometry
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          paths = [
              Path('js/canvas_renderer.js'),
              Path('creator/js/canvas_renderer.js'),
          ]

          old_color_block = '''            const pipe_color = palette[pipe.color_index % palette.length];
              const needs_light_outline =
                  !blocked && pipe_color_needs_light_outline(pipe_color);'''
          new_color_block = '''            const pipe_color = palette[pipe.color_index % palette.length];
              const rendered_pipe_color = blocked ?
                  "#ff7d8f" :
                  hinted ?
                      "#7ee3c5" :
                      pipe_color;
              const needs_light_outline =
                  !blocked && !hinted &&
                  pipe_color_needs_light_outline(pipe_color);'''

          start_marker = '''            this.stroke_polyline(
                  context,
                  points,
                  "#080a0e",
                  outer_width
              );'''
          moving_marker = '''

              if (moving) {
                  this.draw_motion_tip('''

          replacement_draw_block = '''            const arrow_tip = this.stroke_pipe_shape(
                  context,
                  points,
                  pipe.direction,
                  cell_size,
                  "#080a0e",
                  outer_width
              );

              if (needs_light_outline) {
                  const light_outline_width = Math.min(
                      outer_width - Math.max(1, cell_size * 0.04),
                      inner_width + Math.max(1.5, cell_size * 0.1)
                  );
                  this.stroke_pipe_shape(
                      context,
                      points,
                      pipe.direction,
                      cell_size,
                      "#ffffff",
                      light_outline_width
                  );
              }

              this.stroke_pipe_shape(
                  context,
                  points,
                  pipe.direction,
                  cell_size,
                  rendered_pipe_color,
                  inner_width
              );

              if (moving && cell_size >= 5) {
                  context.save();
                  context.globalAlpha = 0.22;
                  this.stroke_pipe_shape(
                      context,
                      points,
                      pipe.direction,
                      cell_size,
                      "#ffffff",
                      Math.max(0.75, inner_width * 0.18)
                  );
                  context.restore();
              }'''

          new_shape_methods = '''        get_pipe_arrow_geometry(center, direction, cell_size) {
              const forward_x = direction.x;
              const forward_y = direction.y;
              const side_x = -forward_y;
              const side_y = forward_x;
              const arrow_reach = cell_size * 0.43;
              const wing_length = cell_size * 0.28;
              const wing_spread = cell_size * 0.205;
              const tip = {
                  x: center.x + forward_x * arrow_reach,
                  y: center.y + forward_y * arrow_reach
              };
              const left_wing = {
                  x:
                      tip.x - forward_x * wing_length +
                      side_x * wing_spread,
                  y:
                      tip.y - forward_y * wing_length +
                      side_y * wing_spread
              };
              const right_wing = {
                  x:
                      tip.x - forward_x * wing_length -
                      side_x * wing_spread,
                  y:
                      tip.y - forward_y * wing_length -
                      side_y * wing_spread
              };

              return { tip, left_wing, right_wing };
          }

          trace_pipe_shape(context, points, direction, cell_size) {
              const geometry = this.get_pipe_arrow_geometry(
                  points[points.length - 1],
                  direction,
                  cell_size
              );

              context.beginPath();
              context.moveTo(points[0].x, points[0].y);

              for (let index = 1; index < points.length; index += 1) {
                  context.lineTo(points[index].x, points[index].y);
              }

              context.lineTo(geometry.tip.x, geometry.tip.y);
              context.moveTo(geometry.tip.x, geometry.tip.y);
              context.lineTo(geometry.left_wing.x, geometry.left_wing.y);
              context.moveTo(geometry.tip.x, geometry.tip.y);
              context.lineTo(geometry.right_wing.x, geometry.right_wing.y);
              return geometry.tip;
          }

          stroke_pipe_shape(
              context,
              points,
              direction,
              cell_size,
              color,
              width
          ) {
              const tip = this.trace_pipe_shape(
                  context,
                  points,
                  direction,
                  cell_size
              );
              context.strokeStyle = color;
              context.lineWidth = width;
              context.stroke();
              return tip;
          }
          '''

          for path in paths:
              text = path.read_text()

              if text.count(old_color_block) != 1:
                  raise RuntimeError(f'{path}: expected one pipe-colour block')
              text = text.replace(old_color_block, new_color_block)

              start = text.find(start_marker)
              if start < 0:
                  raise RuntimeError(f'{path}: body stroke start not found')
              end = text.find(moving_marker, start)
              if end < 0:
                  raise RuntimeError(f'{path}: motion-tip marker not found')
              text = text[:start] + replacement_draw_block + text[end:]

              method_start = text.find('        draw_arrow(\n')
              if method_start < 0:
                  raise RuntimeError(f'{path}: draw_arrow method not found')
              class_end = text.find(
                  '\n    }\n\n    global_scope.ChoobsCanvasRenderer',
                  method_start
              )
              if class_end < 0:
                  raise RuntimeError(f'{path}: renderer class end not found')
              text = text[:method_start] + new_shape_methods + text[class_end:]
              path.write_text(text)
          PY

      - name: Validate unified shape
        shell: bash
        run: |
          node --check js/canvas_renderer.js
          node --check creator/js/canvas_renderer.js

          node <<'JS'
          const fs = require('fs');
          const vm = require('vm');
          const assert = require('assert');

          for (const path of ['js/canvas_renderer.js', 'creator/js/canvas_renderer.js']) {
            const source = fs.readFileSync(path, 'utf8');
            const drawStart = source.indexOf('        draw_pipe(');
            const drawEnd = source.indexOf('        get_intro_alpha(', drawStart);
            const drawPipe = source.slice(drawStart, drawEnd);

            assert(drawStart >= 0 && drawEnd > drawStart);
            assert(!source.includes('        draw_arrow('));
            assert(!drawPipe.includes('this.draw_arrow('));
            assert(!drawPipe.includes('this.stroke_polyline('));
            assert.strictEqual(
              (drawPipe.match(/this\.stroke_pipe_shape\(/g) || []).length,
              4
            );
            assert(drawPipe.includes('rendered_pipe_color'));
            assert(drawPipe.includes('!blocked && !hinted'));

            const sandbox = {};
            vm.runInNewContext(source, sandbox, { filename: path });
            const Renderer = sandbox.ChoobsCanvasRenderer;
            const renderer = Object.create(Renderer.prototype);
            const operations = [];
            const context = {
              beginPath() { operations.push(['beginPath']); },
              moveTo(x, y) { operations.push(['moveTo', x, y]); },
              lineTo(x, y) { operations.push(['lineTo', x, y]); },
              stroke() { operations.push(['stroke']); },
              set strokeStyle(value) { operations.push(['strokeStyle', value]); },
              set lineWidth(value) { operations.push(['lineWidth', value]); }
            };
            const points = [{ x: 0, y: 0 }, { x: 10, y: 0 }];
            const tip = renderer.stroke_pipe_shape(
              context,
              points,
              { x: 1, y: 0 },
              12,
              '#ffffff',
              6
            );

            assert(Math.abs(tip.x - 15.16) < 0.0001);
            assert.strictEqual(tip.y, 0);
            assert.strictEqual(
              operations.filter(([name]) => name === 'beginPath').length,
              1
            );
            assert.strictEqual(
              operations.filter(([name]) => name === 'stroke').length,
              1
            );
            assert.deepStrictEqual(operations[1], ['moveTo', 0, 0]);
            assert.deepStrictEqual(operations[2], ['lineTo', 10, 0]);
            assert.deepStrictEqual(operations[3], ['lineTo', tip.x, tip.y]);
            assert.deepStrictEqual(operations.at(-1), ['stroke']);
          }
          JS

      - name: Commit completed change
        shell: bash
        run: |
          rm -f .github/workflows/integrate-arrow-shape.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate arrows into pipe shapes'
          git push origin HEAD:agent/integrate-arrow-into-pipe-shape
