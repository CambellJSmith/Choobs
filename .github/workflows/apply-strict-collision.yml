name: Apply strict collision wiring

on:
  push:
    branches:
      - agent/prevent-moving-pipe-overlap
    paths:
      - .github/workflows/apply-strict-collision.yml

permissions:
  contents: write

jobs:
  wire-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/prevent-moving-pipe-overlap

      - name: Wire collision rules into app shell
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index_path = Path("index.html")
          index = index_path.read_text()
          index_needle = (
              '    <script src="js/pipe_only_renderer.js"></script>\n'
              '    <script src="js/game.js"></script>'
          )
          index_replacement = (
              '    <script src="js/pipe_only_renderer.js"></script>\n'
              '    <script src="js/strict_collision_rules.js"></script>\n'
              '    <script src="js/game.js"></script>'
          )
          if index_needle not in index:
              raise SystemExit("Could not locate game script order in index.html")
          index_path.write_text(index.replace(index_needle, index_replacement, 1))

          worker_path = Path("service-worker.js")
          worker = worker_path.read_text()
          worker_needle = (
              '    "./js/pipe_only_renderer.js",\n'
              '    "./js/game.js",'
          )
          worker_replacement = (
              '    "./js/pipe_only_renderer.js",\n'
              '    "./js/strict_collision_rules.js",\n'
              '    "./js/game.js",'
          )
          if worker_needle not in worker:
              raise SystemExit("Could not locate game assets in service-worker.js")
          worker_path.write_text(worker.replace(worker_needle, worker_replacement, 1))
          PY

          node --check js/strict_collision_rules.js
          git rm .github/workflows/apply-strict-collision.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js js/strict_collision_rules.js
          git commit -m "Wire strict trajectory checks into the app"
          git push origin HEAD:agent/prevent-moving-pipe-overlap
