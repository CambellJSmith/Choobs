name: Cache pipe-only renderer

on:
  push:
    branches:
      - agent/pipe-only-board
    paths:
      - .github/workflows/cache-pipe-only-renderer.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pipe-only-board

      - name: Add renderer to the PWA app shell
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("service-worker.js")
          content = path.read_text(encoding="utf-8")
          old = '    "./js/canvas_renderer.js",\n    "./js/game.js",'
          new = '    "./js/canvas_renderer.js",\n    "./js/pipe_only_renderer.js",\n    "./js/game.js",'

          if old not in content:
              raise SystemExit("Expected app-shell renderer entries were not found.")

          path.write_text(content.replace(old, new, 1), encoding="utf-8")
          PY

          rm .github/workflows/cache-pipe-only-renderer.yml

      - name: Commit generated edit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add service-worker.js .github/workflows/cache-pipe-only-renderer.yml
          git commit -m "Cache pipe-only game renderer"
          git push
