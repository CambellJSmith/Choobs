name: Update creator quantisation

on:
  push:
    branches:
      - agent/unlimited-quantization-controls

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unlimited-quantization-controls

      - name: Apply updates
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/update_creator.py
          python /tmp/update_creator.py

      - name: Validate
        shell: bash
        run: |
          node --check js/engine.js
          node --check creator/js/engine.js
          node --check creator/js/creator.js
          node --check creator/js/unlimited_quantization.js
          node --check creator/js/generation_worker_source.js

          node <<'JS'
          const fs = require("fs");
          const vm = require("vm");
          const assert = require("assert");

          const context = { console };
          context.globalThis = context;
          vm.createContext(context);
          vm.runInContext(
              fs.readFileSync("creator/js/engine.js", "utf8"),
              context
          );

          const palette = Array.from({ length: 32 }, (_, index) =>
              `#${index.toString(16).padStart(6, "0")}`
          );
          const mask = Array(16).fill(0);
          mask[0] = 1;
          const level = context.Choobs.normalize_level({
              version: 1,
              number: 1,
              name: "palette test",
              palette,
              columns: 4,
              rows: 4,
              mask,
              pipes: [{
                  id: 0,
                  color_index: 31,
                  cells: [[0, 0]],
                  direction: [1, 0]
              }],
              solution_order: [0],
              settings: {}
          });
          assert.strictEqual(level.palette.length, 32);
          assert.strictEqual(level.pipes[0].color_index, 31);

          vm.runInContext(
              fs.readFileSync(
                  "creator/js/generation_worker_source.js",
                  "utf8"
              ),
              context
          );
          assert(
              context.ChoobsGenerationWorkerSource.includes(
                  "MAX_PALETTE_SIZE = 2500"
              )
          );
          assert(
              context.ChoobsGenerationWorkerSource.includes(
                  "Uint16Array.from(options.color_map"
              )
          );
          new vm.Script(context.ChoobsGenerationWorkerSource);

          const creator = fs.readFileSync(
              "creator/js/creator.js",
              "utf8"
          );
          assert(
              creator.includes(
                  "MAX_QUANTIZATION_TARGETS = GRID_SIZE * GRID_SIZE"
              )
          );
          assert(
              creator.includes(
                  "globalThis.ChoobsCreatorApp"
              )
          );

          const html = fs.readFileSync(
              "creator/index.html",
              "utf8"
          );
          assert(
              html.includes(
                  "js/unlimited_quantization.js"
              )
          );

          const css = fs.readFileSync(
              "creator/styles.css",
              "utf8"
          );
          assert(css.includes("width: fit-content !important"));
          JS

      - name: Commit changes
        shell: bash
        run: |
          rm .github/workflows/update-creator-quantisation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add creator/index.html creator/styles.css creator/creator.css \
              creator/js/creator.js creator/js/engine.js \
              creator/js/generation_worker_source.js \
              creator/js/unlimited_quantization.js js/engine.js \
              service-worker.js \
              .github/workflows/update-creator-quantisation.yml
          git commit -m "Expand creator quantisation controls"
          git push
